name: Termux bridge unit tests
on:
  push:
    branches: [feat/termux-readonly-bridge-20261027]
  pull_request:
    paths:
      - 'android-personal-automator/bridge/**'
      - '.github/workflows/termux-bridge-tests.yml'
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run bridge unit tests
        run: python -m unittest discover -s android-personal-automator/bridge -p 'test_*.py' -v
      - name: Validate Termux supervisor shell syntax
        run: bash -n android-personal-automator/bridge/live_update_termux.sh
      - name: Validate WebSocket transport syntax
        run: python -m py_compile android-personal-automator/bridge/ws/relay.py android-personal-automator/bridge/ws/device.py

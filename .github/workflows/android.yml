name: Android

on:
  push:
    paths:
      - 'android-personal-automator/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-personal-automator/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-personal-automator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.16+8'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble, lint, and unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-personal-automator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android-personal-automator/app/build/reports/
          if-no-files-found: warn

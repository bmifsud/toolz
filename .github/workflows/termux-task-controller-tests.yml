name: Termux Task Controller Tests
on:
  push:
    branches:
      - feat/termux-persistent-task-controller-20261028
  pull_request:
    paths:
      - 'android-personal-automator/bridge/ws/task_controller.py'
      - 'android-personal-automator/bridge/ws/test_task_controller.py'
      - '.github/workflows/termux-task-controller-tests.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline controller tests
        working-directory: android-personal-automator/bridge/ws
        run: python -m unittest -v test_task_controller.py

name: Android Emulator Readiness
on:
  push:
    branches:
      - test/android-emulator-readiness-20261028
  pull_request:
    paths:
      - '.github/workflows/android-emulator-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Host environment
        run: |
          uname -a
          test -e /dev/kvm && ls -l /dev/kvm || echo 'KVM not available'
          df -h .
          free -h
      - name: Boot emulator and verify ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            set -eu
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            adb devices -l
            mkdir -p emulator-receipts
            adb shell getprop > emulator-receipts/device-properties.txt
            adb devices -l > emulator-receipts/adb-devices.txt
            echo "PASS: emulator booted and ADB connected" | tee emulator-receipts/result.txt
      - name: Save readiness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-readiness
          path: emulator-receipts/
          if-no-files-found: warn
          retention-days: 7

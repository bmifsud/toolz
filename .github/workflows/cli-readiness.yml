name: CLI readiness package

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./cli
      - run: python -m unittest discover -s cli/tests -v
      - run: toolz-readiness --json

name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install static-test runner
        run: python -m pip install pytest==8.3.5
      - name: Run routing and receipt tests
        run: python -m unittest discover -s android-personal-automator/bridge/tests -p 'test_*.py' -v
      - name: Run local proposal bridge and supervisor fixtures
        run: python -m unittest discover -s android-personal-automator/bridge -p 'test_*.py' -v
      - name: Run device-helper fixtures
        run: python -m unittest discover -s android-personal-automator/device-tests -p 'test_*.py' -v
      - name: Run pytest static setup checks
        run: python -m pytest android-personal-automator/bridge/test_*static.py -q
      - name: Record scope
        shell: bash
        run: |
          echo 'Maintained offline fixtures and static checks ran. Android instrumentation, live Termux/Debian/Cline, cloud backups and physical-device acceptance are separate gates.' >> "$GITHUB_STEP_SUMMARY"

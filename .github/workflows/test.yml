name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect legacy launcher component
        id: launcher
        shell: bash
        run: |
          if [[ -d scripts ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Legacy tmux suite not applicable: scripts/ was removed from this repository." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure tmux is installed
        if: steps.launcher.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Run automated test suite
        if: steps.launcher.outputs.present == 'true'
        run: |
          bash tests/test-launch-ai-tmux.sh

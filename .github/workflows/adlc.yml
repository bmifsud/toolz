name: ADLC checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest gnupg sqlite3
      - name: Run offline gate
        id: gate
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/adlc-evidence/tests.xml
        run: |
          mkdir -p "$RUNNER_TEMP/adlc-evidence"
          fixture_root=$(mktemp -d /tmp/adlc.XXXXXX)
          trap 'rm -rf -- "$fixture_root"' EXIT
          mkdir -p "$fixture_root/home" "$fixture_root/tmp"
          env -i PATH=/usr/bin:/bin HOME="$fixture_root/home" \
            TMPDIR="$fixture_root/tmp" LANG=C.UTF-8 \
            PYTEST_ADDOPTS="$PYTEST_ADDOPTS" \
            bash tests/run-all-tests.sh
      - name: Record tested revision
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/adlc-evidence
        run: |
          python3 scripts/ci_receipt.py
      - name: Preserve offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adlc-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adlc-evidence/
          retention-days: 14
          if-no-files-found: error

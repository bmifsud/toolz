name: Gemini documentation adapter tests
on:
  pull_request:
    paths:
      - 'scripts/gemini_docs_advisory.py'
      - 'tests/test_gemini_docs_advisory.py'
      - '.github/workflows/gemini-docs-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline Gemini adapter tests
        run: python -m unittest discover -s tests -p test_gemini_docs_advisory.py -v

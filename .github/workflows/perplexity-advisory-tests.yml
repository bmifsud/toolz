name: Perplexity advisory adapter tests
on:
  pull_request:
    paths:
      - 'scripts/perplexity_advisory.py'
      - 'tests/test_perplexity_advisory.py'
      - '.github/workflows/perplexity-advisory-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without network or API credentials
        run: python -m unittest discover -s tests -p test_perplexity_advisory.py -v
